<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocol Graph Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --white: #ffffff;
    --surface: #ffffff;
    --surface-hover: #f9fafb;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --accent: #6366f1;
    --accent-light: #eef2ff;
    --accent-hover: #4f46e5;
    --green: #10b981;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --blue: #3b82f6;
    --blue-bg: #eff6ff;
    --blue-border: #bfdbfe;
    --orange: #f59e0b;
    --orange-bg: #fffbeb;
    --orange-border: #fde68a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 6px 12px rgba(0,0,0,.05);
    --radius: 12px;
    --radius-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── Header ─── */
  header {
    height: 64px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 50;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(99,102,241,.35);
  }
  .logo h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -.03em;
    color: var(--text);
  }
  .logo h1 span { color: var(--text-muted); font-weight: 400; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    font-size: .8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
    background: var(--surface-hover);
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 2px 8px rgba(99,102,241,.3);
  }
  .btn-sm { padding: 5px 11px; font-size: .75rem; border-radius: 6px; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--bg); border-color: var(--border); }

  /* ─── Quick Load Bar ─── */
  .quickload {
    padding: 10px 28px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
  }
  .quickload-label {
    font-size: .75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    white-space: nowrap;
    margin-right: 4px;
  }
  .ql-filter {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .73rem;
    font-family: inherit;
    width: 180px;
    outline: none;
    color: var(--text);
    background: var(--bg);
    margin-right: 6px;
  }
  .ql-filter:focus { border-color: var(--accent); background: var(--white); }
  .ql-filter::placeholder { color: var(--text-muted); }
  .ql-btn {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text-secondary);
    font-size: .7rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .ql-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }
  .ql-btn.gold { border-left: 3px solid var(--green); }
  .ql-btn.irpg { border-left: 3px solid var(--blue); }
  .ql-btn.vic { border-left: 3px solid var(--orange); }
  .ql-book {
    font-size: .58rem;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .ql-book.irpg { background: #dbeafe; color: #1e40af; }
  .ql-book.vic { background: #fef3c7; color: #92400e; }
  .ql-group {
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .ql-divider {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
  }
  .ql-count {
    font-size: .65rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ─── Panels Container ─── */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    background: var(--bg);
  }
  .panel + .panel { border-left: 1px solid var(--border); }

  .panel-header {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 50px;
  }
  .panel-title-area { display: flex; align-items: center; gap: 10px; }
  .panel-badge {
    width: 6px; height: 24px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }
  .panel-subtitle {
    font-size: .7rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .panel-actions { display: flex; gap: 4px; }

  /* ─── Drop Zone ─── */
  .drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .25s ease;
    margin: 20px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    background: var(--white);
  }
  .drop-zone:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
    transform: scale(1.005);
    box-shadow: 0 0 0 4px rgba(99,102,241,.1);
  }
  .drop-icon {
    width: 64px; height: 64px;
    background: var(--accent-light);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    transition: all .25s;
  }
  .drop-zone:hover .drop-icon { background: #ddd6fe; }
  .drop-icon svg { width: 28px; height: 28px; color: var(--accent); }
  .drop-zone .drop-text { font-size: .95rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .drop-zone .drop-hint { font-size: .8rem; color: var(--text-muted); }
  .drop-zone input[type="file"] { display: none; }

  /* ─── Graph Container ─── */
  .graph-area {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  .graph-area.active { display: flex; }
  .vis-container {
    flex: 1;
    min-height: 0;
    position: relative;
    background: var(--white);
    margin: 8px 8px 0 8px;
    border-radius: var(--radius) var(--radius) 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    overflow: hidden;
  }
  /* Hide vis.js default tooltip */
  .vis-tooltip { display: none !important; }

  /* ─── Stats Bar ─── */
  .stats-bar {
    padding: 10px 16px;
    background: var(--white);
    margin: 0 8px 8px 8px;
    border-radius: 0 0 var(--radius) var(--radius);
    border: 1px solid var(--border);
    border-top: none;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    flex-shrink: 0;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: .75rem;
  }
  .stat-value { font-weight: 700; color: var(--text); }
  .stat-label { color: var(--text-muted); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .7rem;
    font-weight: 600;
    border: 1px solid;
  }
  .chip-start    { background: var(--green-bg);  color: #059669; border-color: var(--green-border); }
  .chip-end      { background: var(--red-bg);    color: #dc2626; border-color: var(--red-border); }
  .chip-action   { background: var(--blue-bg);   color: #2563eb; border-color: var(--blue-border); }
  .chip-decision { background: var(--orange-bg); color: #d97706; border-color: var(--orange-border); }

  /* ─── Legend ─── */
  .legend {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    padding: 10px 24px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    font-size: .78rem;
    font-weight: 500;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
  }
  .legend-shape {
    width: 18px; height: 18px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
  }
  .legend-shape.diamond {
    border-radius: 2px;
    transform: rotate(45deg);
    width: 14px; height: 14px;
  }

  /* ─── Tooltip ─── */
  .graph-tooltip {
    position: fixed;
    padding: 14px 18px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    font-size: .8rem;
    line-height: 1.6;
    max-width: 360px;
    pointer-events: none;
    z-index: 300;
    display: none;
  }
  .graph-tooltip .tt-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .graph-tooltip .tt-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .graph-tooltip .tt-id {
    font-size: .7rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .graph-tooltip .tt-text {
    color: var(--text);
    font-weight: 500;
  }
  .graph-tooltip .tt-evidence {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: .73rem;
    color: var(--text-secondary);
    display: flex;
    gap: 6px;
    line-height: 1.5;
  }
  .graph-tooltip .tt-evidence-icon { flex-shrink: 0; margin-top: 1px; }

  /* ─── Layout toggle ─── */
  .layout-toggle {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 10;
    display: flex;
    gap: 4px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    box-shadow: var(--shadow);
  }
  .lay-btn {
    padding: 4px 10px;
    font-size: .7rem;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 5px;
    font-family: inherit;
    transition: all .15s;
  }
  .lay-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .lay-btn:hover:not(.active) { background: var(--bg); }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/>
        <line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/>
      </svg>
    </div>
    <h1>Protocol Graph <span>Viewer</span></h1>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="addPanel()" id="addPanelBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Panel
    </button>
    <button class="btn btn-ghost" onclick="resetAll()">Reset</button>
  </div>
</header>

<div class="quickload" id="quickload">
  <span class="quickload-label">Quick Load</span>
</div>

<div class="main" id="main"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-shape" style="background:#10b981"></div> Start</div>
  <div class="legend-item"><div class="legend-shape" style="background:#ef4444"></div> End</div>
  <div class="legend-item"><div class="legend-shape" style="background:#3b82f6"></div> Action</div>
  <div class="legend-item"><div class="legend-shape diamond" style="background:#f59e0b"></div> Decision</div>
</div>

<div class="graph-tooltip" id="tooltip"></div>

<script>
/* ============================================================
   STATE
   ============================================================ */
const state = { panels: [], idCounter: 0 };
const BADGE_COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444'];

/* ============================================================
   VIS.JS NODE STYLES
   ============================================================ */
const NODE_STYLE = {
  start: {
    color: { background: '#10b981', border: '#059669',
      highlight: { background: '#34d399', border: '#047857' },
      hover:     { background: '#34d399', border: '#047857' } },
    shape: 'box', borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(16,185,129,.22)', size: 14, x: 0, y: 4 },
    font: { color: '#fff', face: 'Inter, system-ui', size: 12, bold: { color: '#fff' } },
  },
  end: {
    color: { background: '#ef4444', border: '#dc2626',
      highlight: { background: '#f87171', border: '#b91c1c' },
      hover:     { background: '#f87171', border: '#b91c1c' } },
    shape: 'box', borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(239,68,68,.18)', size: 14, x: 0, y: 4 },
    font: { color: '#fff', face: 'Inter, system-ui', size: 12 },
  },
  action: {
    color: { background: '#3b82f6', border: '#2563eb',
      highlight: { background: '#60a5fa', border: '#1d4ed8' },
      hover:     { background: '#60a5fa', border: '#1d4ed8' } },
    shape: 'box', borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(59,130,246,.18)', size: 14, x: 0, y: 4 },
    font: { color: '#fff', face: 'Inter, system-ui', size: 12 },
  },
  decision: {
    color: { background: '#f59e0b', border: '#d97706',
      highlight: { background: '#fbbf24', border: '#b45309' },
      hover:     { background: '#fbbf24', border: '#b45309' } },
    shape: 'diamond', borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(245,158,11,.22)', size: 14, x: 0, y: 4 },
    font: { color: '#78350f', face: 'Inter, system-ui', size: 11 },
  },
};

/* ============================================================
   HELPERS
   ============================================================ */
function truncate(s, n = 30) {
  if (!s) return '';
  return s.length <= n ? s : s.substring(0, n - 1) + '…';
}

function buildVisData(protocol) {
  const nodes = [], edges = [];

  (protocol.nodes || []).forEach(n => {
    const style = NODE_STYLE[n.type] || NODE_STYLE.action;
    nodes.push({
      id: n.id,
      label: truncate(n.text, 30),
      ...JSON.parse(JSON.stringify(style)),  // deep clone styles
      _raw: n,
      margin: { top: 10, bottom: 10, left: 14, right: 14 },
      shapeProperties: { borderRadius: n.type === 'decision' ? 0 : 8 },
      widthConstraint: { minimum: 60, maximum: 200 },
    });
  });

  (protocol.edges || []).forEach((e, i) => {
    const edge = {
      id: `e${i}`,
      from: e.from,
      to: e.to,
      arrows: { to: { enabled: true, scaleFactor: 0.7, type: 'arrow' } },
      color: { color: '#c7c9d3', highlight: '#6366f1', hover: '#818cf8', opacity: 0.9 },
      width: 2,
      smooth: { enabled: true, type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.35 },
      font: {
        size: 9, color: '#6b7280', strokeWidth: 4, strokeColor: '#ffffff',
        face: 'Inter, system-ui', align: 'horizontal', background: '#ffffff',
      },
      hoverWidth: 0.5,
      selectionWidth: 1,
      _raw: e,
    };
    if (e.condition) edge.label = e.condition;
    edges.push(edge);
  });

  return { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
}

function getStats(data) {
  const nodes = data.nodes || [], edges = data.edges || [];
  const types = {};
  nodes.forEach(n => types[n.type] = (types[n.type] || 0) + 1);
  return { nodeCount: nodes.length, edgeCount: edges.length, types };
}

/* ============================================================
   PANEL MANAGEMENT
   ============================================================ */
function addPanel(label) {
  state.idCounter++;
  const id = state.idCounter;
  const lbl = label || `Panel ${id}`;
  const panel = { id, network: null, data: null, layout: 'hierarchical' };
  state.panels.push(panel);

  const color = BADGE_COLORS[(id - 1) % BADGE_COLORS.length];
  const el = document.createElement('div');
  el.className = 'panel';
  el.id = `panel-${id}`;
  el.innerHTML = `
    <div class="panel-header">
      <div class="panel-title-area">
        <div class="panel-badge" style="background:${color}"></div>
        <div>
          <div class="panel-title" id="ptitle-${id}">${lbl}</div>
          <div class="panel-subtitle" id="psub-${id}">No file loaded</div>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-sm btn-ghost" onclick="fitPanel(${id})" title="Fit view">⊡ Fit</button>
        <button class="btn btn-sm btn-ghost" onclick="clearPanel(${id})">Clear</button>
        ${state.panels.length > 2 ? `<button class="btn btn-sm btn-ghost" onclick="removePanel(${id})" style="color:var(--red)">✕</button>` : ''}
      </div>
    </div>
    <div class="drop-zone" id="dz-${id}" onclick="document.getElementById('fi-${id}').click()">
      <div class="drop-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="drop-text">Drop protocol JSON here</div>
      <div class="drop-hint">or click to browse files</div>
      <input type="file" accept=".json" id="fi-${id}" onchange="handleFile(event,${id})">
    </div>
    <div class="graph-area" id="ga-${id}">
      <div class="vis-container" id="vc-${id}">
        <div class="layout-toggle">
          <button class="lay-btn active" id="lay-hier-${id}" onclick="setLayout(${id},'hierarchical')">Hierarchy</button>
          <button class="lay-btn" id="lay-force-${id}" onclick="setLayout(${id},'force')">Force</button>
        </div>
      </div>
      <div class="stats-bar" id="sb-${id}"></div>
    </div>`;
  document.getElementById('main').appendChild(el);
  initDropZone(id);
  updateAddBtn();
  return id;
}

function removePanel(id) {
  const idx = state.panels.findIndex(p => p.id === id);
  if (idx === -1) return;
  if (state.panels[idx].network) state.panels[idx].network.destroy();
  state.panels.splice(idx, 1);
  document.getElementById(`panel-${id}`)?.remove();
  updateAddBtn();
}

function clearPanel(id) {
  const p = state.panels.find(p => p.id === id);
  if (!p) return;
  if (p.network) { p.network.destroy(); p.network = null; }
  p.data = null;
  document.getElementById(`ga-${id}`).classList.remove('active');
  document.getElementById(`dz-${id}`).style.display = '';
  document.getElementById(`ptitle-${id}`).textContent = `Panel ${p.id}`;
  document.getElementById(`psub-${id}`).textContent = 'No file loaded';
}

function resetAll() { state.panels.forEach(p => clearPanel(p.id)); }
function updateAddBtn() {
  document.getElementById('addPanelBtn').style.display = state.panels.length >= 4 ? 'none' : '';
}

function fitPanel(id) {
  const p = state.panels.find(p => p.id === id);
  if (p?.network) p.network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
}

/* ============================================================
   LAYOUTS
   ============================================================ */
function setLayout(id, type) {
  const p = state.panels.find(p => p.id === id);
  if (!p?.data) return;
  p.layout = type;
  document.getElementById(`lay-hier-${id}`).classList.toggle('active', type === 'hierarchical');
  document.getElementById(`lay-force-${id}`).classList.toggle('active', type === 'force');
  renderGraph(id, p.data, document.getElementById(`ptitle-${id}`).textContent);
}

function getLayoutOptions(type) {
  if (type === 'hierarchical') {
    return {
      layout: {
        hierarchical: {
          enabled: true, direction: 'UD', sortMethod: 'directed',
          levelSeparation: 110, nodeSpacing: 170, treeSpacing: 220,
          blockShifting: true, edgeMinimization: true, parentCentralization: true,
        }
      },
      physics: {
        enabled: true,
        hierarchicalRepulsion: {
          centralGravity: 0, springLength: 130, springConstant: 0.01,
          nodeDistance: 170, damping: 0.09, avoidOverlap: 0.6,
        },
        stabilization: { iterations: 200, fit: true },
      }
    };
  }
  return {
    layout: { hierarchical: { enabled: false } },
    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -4000, centralGravity: 0.3,
        springLength: 160, springConstant: 0.04, damping: 0.09, avoidOverlap: 0.4,
      },
      stabilization: { iterations: 350, fit: true },
    }
  };
}

/* ============================================================
   DROP ZONE
   ============================================================ */
function initDropZone(id) {
  const z = document.getElementById(`dz-${id}`);
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('dragover'); });
  z.addEventListener('dragleave', () => z.classList.remove('dragover'));
  z.addEventListener('drop', e => {
    e.preventDefault(); z.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], id);
  });
}

function handleFile(evt, id) { if (evt.target.files[0]) loadFile(evt.target.files[0], id); }

function loadFile(file, id) {
  const reader = new FileReader();
  reader.onload = e => {
    try { renderGraph(id, JSON.parse(e.target.result), file.name.replace('.json','')); }
    catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ============================================================
   RENDER
   ============================================================ */
function renderGraph(id, data, label) {
  const p = state.panels.find(p => p.id === id);
  if (!p) return;
  p.data = data;

  document.getElementById(`ptitle-${id}`).textContent = data.title || label || `Panel ${id}`;
  const stats = getStats(data);
  document.getElementById(`psub-${id}`).textContent = `${stats.nodeCount} nodes · ${stats.edgeCount} edges`;
  document.getElementById(`dz-${id}`).style.display = 'none';
  document.getElementById(`ga-${id}`).classList.add('active');

  if (p.network) { p.network.destroy(); p.network = null; }

  const visData = buildVisData(data);
  const container = document.getElementById(`vc-${id}`);
  const opts = {
    ...getLayoutOptions(p.layout),
    nodes: { font: { multi: false } },
    edges: { selectionWidth: 1.5 },
    interaction: {
      hover: true, tooltipDelay: 80, zoomView: true, dragView: true,
      navigationButtons: false, keyboard: false, hoverConnectedEdges: true,
    },
    autoResize: true,
  };

  p.network = new vis.Network(container, visData, opts);

  /* — Tooltip — */
  const tip = document.getElementById('tooltip');
  const typeColors = { start:'#059669', end:'#dc2626', action:'#2563eb', decision:'#d97706' };
  const typeBgs   = { start:'#ecfdf5', end:'#fef2f2', action:'#eff6ff', decision:'#fffbeb' };

  p.network.on('hoverNode', ev => {
    const raw = visData.nodes.get(ev.node)?._raw;
    if (!raw) return;
    const col = typeColors[raw.type]||'#6b7280', bg = typeBgs[raw.type]||'#f3f4f6';
    let h = `<div class="tt-header"><span class="tt-badge" style="background:${bg};color:${col}">${raw.type}</span><span class="tt-id">${raw.id}</span></div>`;
    h += `<div class="tt-text">${raw.text}</div>`;
    if (raw.evidence?.source_text) h += `<div class="tt-evidence"><span class="tt-evidence-icon">📄</span><span>Page ${raw.evidence.page}: "${raw.evidence.source_text}"</span></div>`;
    tip.innerHTML = h; tip.style.display = 'block';
    const c = ev.event.center || ev.pointer?.DOM;
    if (c) {
      const r = container.getBoundingClientRect();
      let left = r.left + c.x + 18, top = r.top + c.y - 10;
      tip.style.left = left+'px'; tip.style.top = top+'px';
      requestAnimationFrame(() => {
        const tr = tip.getBoundingClientRect();
        if (tr.right > window.innerWidth - 10) tip.style.left = (r.left + c.x - tr.width - 10)+'px';
        if (tr.bottom > window.innerHeight - 10) tip.style.top = (r.top + c.y - tr.height - 10)+'px';
      });
    }
  });
  p.network.on('blurNode', () => tip.style.display = 'none');
  p.network.on('dragStart', () => tip.style.display = 'none');
  p.network.on('zoom', () => tip.style.display = 'none');

  p.network.once('stabilizationIterationsDone', () => {
    p.network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  });

  /* — Stats — */
  const sb = document.getElementById(`sb-${id}`);
  let sh = `<div class="stat"><span class="stat-value">${stats.nodeCount}</span><span class="stat-label">nodes</span></div>
             <div class="stat"><span class="stat-value">${stats.edgeCount}</span><span class="stat-label">edges</span></div>`;
  for (const [t,c] of Object.entries(stats.types)) sh += `<span class="chip chip-${t}">${c} ${t}</span>`;
  if (data.protocol_type) sh += `<div class="stat"><span class="stat-label">type:</span><span class="stat-value">${data.protocol_type}</span></div>`;
  if (data.extraction_confidence != null) sh += `<div class="stat"><span class="stat-label">conf:</span><span class="stat-value">${Math.round(data.extraction_confidence*100)}%</span></div>`;
  if (data._extraction_meta) {
    const m = data._extraction_meta;
    if (m.total_tokens) sh += `<div class="stat"><span class="stat-label">tokens:</span><span class="stat-value">${m.total_tokens.toLocaleString()}</span></div>`;
    if (m.multimodal) sh += `<span class="chip chip-decision">multimodal</span>`;
  }
  sb.innerHTML = sh;
}

/* ============================================================
   QUICK LOAD
   ============================================================ */
async function setupQuickLoad() {
  const bar = document.getElementById('quickload');

  let manifest;
  try { manifest = await (await fetch('evaluation/manifest.json')).json(); }
  catch { return; }

  const gold = manifest.gold || [];
  const extracted = manifest.extracted || [];
  const irpg = extracted.filter(e => e.source === 'IRPG');
  const vic  = extracted.filter(e => e.source === 'VIC');

  /* ── Filter input ── */
  const filter = document.createElement('input');
  filter.className = 'ql-filter';
  filter.type = 'text';
  filter.placeholder = 'Filter protocols...';
  bar.appendChild(filter);

  /* ── Count ── */
  const countEl = document.createElement('span');
  countEl.className = 'ql-count';
  countEl.textContent = `${gold.length} gold · ${irpg.length} IRPG · ${vic.length} VIC`;
  bar.appendChild(countEl);

  /* ── Build buttons ── */
  const allBtns = [];

  function addGroup(label) {
    const d1 = document.createElement('div'); d1.className='ql-divider'; bar.appendChild(d1);
    const g = document.createElement('span'); g.className='ql-group'; g.textContent=label; bar.appendChild(g);
    return [d1, g];
  }

  function addBtn(item, group) {
    const b = document.createElement('button');
    b.className = 'ql-btn ' + group;
    const icon = group === 'gold' ? '◆ ' : '◇ ';
    b.innerHTML = icon + item.title;
    if (group !== 'gold' && item.source) {
      const tag = document.createElement('span');
      tag.className = 'ql-book ' + item.source.toLowerCase();
      tag.textContent = item.source;
      b.appendChild(tag);
    }
    b.dataset.title = item.title.toLowerCase();
    b.onclick = async () => {
      try {
        const data = await (await fetch(item.path)).json();
        let t = state.panels.find(p => !p.data);
        if (!t && state.panels.length < 4) { const nid = addPanel(); t = state.panels.find(p => p.id === nid); }
        if (t) renderGraph(t.id, data, item.title);
      } catch (err) { alert('Load failed: ' + err.message); }
    };
    bar.appendChild(b);
    allBtns.push(b);
    return b;
  }

  /* Gold */
  const goldEls = addGroup('Gold');
  gold.forEach(g => addBtn(g, 'gold'));

  /* IRPG */
  const irpgEls = addGroup('IRPG 2025');
  irpg.forEach(e => addBtn(e, 'irpg'));

  /* VIC */
  const vicEls = addGroup('VIC Handbook');
  vic.forEach(e => addBtn(e, 'vic'));

  /* ── Filter logic ── */
  filter.addEventListener('input', () => {
    const q = filter.value.toLowerCase().trim();
    allBtns.forEach(b => {
      b.style.display = (!q || b.dataset.title.includes(q)) ? '' : 'none';
    });
  });
}

/* ============================================================
   INIT
   ============================================================ */
addPanel('Left');
addPanel('Right');
setupQuickLoad();
</script>
